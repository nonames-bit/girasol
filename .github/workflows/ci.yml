name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy --strict
        run: mypy --strict src/

      # Objetivo exacto del brief §7: 85 % sobre features.py.
      - name: pytest with coverage on features.py
        run: pytest --cov=girasol.features --cov-fail-under=85

  changelog:
    name: CHANGELOG updated with src changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if ml/src changed without CHANGELOG
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -q '^ml/src/'; then
            if ! echo "$changed" | grep -q '^CHANGELOG.md$'; then
              echo "::error::ml/src/ changed but CHANGELOG.md did not."
              exit 1
            fi
          fi
