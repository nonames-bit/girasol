name: Parity (ST vs Python)

on:
  pull_request:
    paths:
      - "plc/**"
      - "ml/src/girasol/features.py"
      - "ml/tests/golden/**"
      - ".github/workflows/parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Golden vectors within 1e-4
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # La condición debe ser la MISMA que el skip de ml/tests/test_parity.py:19
      # (Python y ST, ambos), o el job daría verde sin comparar nada.
      - name: Skip when golden vectors do not exist yet
        id: golden
        run: |
          if ls tests/golden/*.json >/dev/null 2>&1 && ls tests/golden/st/*.json >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Golden vectors (Python y ST) incompletos — se omite la paridad. Ver ml/tests/golden/README.md."
          fi

      # -p no:cov: este job verifica paridad, no cobertura. La cobertura es opt-in
      # (no está en addopts), pero se desactiva explícitamente para que nunca
      # herede [tool.coverage.report].fail_under y falle por cobertura.
      - name: Run parity tests
        if: steps.golden.outputs.ready == 'true'
        run: pytest tests/test_parity.py -v -p no:cov
